# 航海集市 Nginx 配置（「前台接待」）
#   /api/...      转交给后端容器
#   /uploads/...  直接从图片数据卷取文件
#   其他路径      返回前端页面，由 Vue 路由处理

server {
    listen 80;
    server_name _;

    # 不在响应里暴露 Nginx 版本号
    server_tokens off;

    # 上传图片：后端限制 5MB，这里放宽到 6MB，避免请求还没到后端就被 Nginx 拦下
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩文字类文件再传输，3M 带宽下页面打开更快
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 接口：转给后端容器（名字 backend 来自 docker-compose.yml）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 告诉后端访客的真实 IP。注意是「覆盖」而不是「追加」，防止访客自己伪造这个请求头
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 小航最多要等 60 秒（前端也是 60 秒超时），这里留足余量
        proxy_read_timeout 90s;
    }

    # 用户上传的图片：只读挂载的数据卷，Nginx 直接返回，不经过后端
    location /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # 禁止浏览器把图片「猜」成网页或脚本来执行
        add_header X-Content-Type-Options nosniff;
    }

    # 打包产物的文件名带内容哈希，内容一变文件名就变，所以可以让浏览器缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 首页不缓存：保证每次更新后同学们打开的都是新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 其他路径（如 /items/5、/me）都返回首页，由 Vue 路由决定显示哪个页面
    location / {
        try_files $uri $uri/ /index.html;
    }
}
